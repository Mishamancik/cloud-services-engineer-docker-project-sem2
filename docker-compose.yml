services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      tags:
        - momo-backend:${MOMO_BACKEND_VERSION:-recent}
        - momo-backend:latest
    restart: unless-stopped
    expose:
      - "8081"
    networks:
      - main_network
      - backend
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-/api}
      tags:
        - momo-frontend:${MOMO_FRONTEND_VERSION:-recent}
        - momo-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - main_network
      - frontend
    volumes:
      - frontend_data:/usr/share

networks:
  main_network:
    driver: bridge
  frontend:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true

volumes:
  backend_data:
  frontend_data:
