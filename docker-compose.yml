services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: momo-backend:${MOMO_BACKEND_VERSION:-recent}
    restart: unless-stopped
    expose:
      - "8081"
    networks:
      - main_network
      - backend
    volumes:
      - backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-/api}
    image: momo-frontend:${MOMO_FRONTEND_VERSION:-recent}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - main_network
      - frontend
    volumes:
      - frontend:/usr/share

networks:
  main_network:
    driver: bridge
  frontend:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true

volumes:
  backend:
  frontend:
